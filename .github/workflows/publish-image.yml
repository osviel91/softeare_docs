name: Publish container image

# Builds the production image and publishes it to GitHub Container Registry
# (GHCR) so a Portainer stack can pull it — see deploy/portainer-stack.yml.
#
# Pushing to master publishes `latest`; pushing a `vX.Y.Z` tag publishes that
# version plus the moving `X.Y` tag. Every build also gets an immutable
# `sha-<short>` tag, which is what a stack should pin to when a deploy has to be
# reproducible.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  # Lets the image be rebuilt from the Actions tab without a commit.
  workflow_dispatch:

# A newer push to the same ref supersedes a build that is still running.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish job opts into `packages: write`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # github.repository is already lower-case, which GHCR requires. The per-service
  # image name is derived in the publish job's matrix, which is what lets the
  # three images of Phase 6 be published from one workflow.

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # .npmrc points npm's cache at the project-local ./.npm-cache, which is
      # wrong for a fresh checkout. Redirect it to a stable path so it can be
      # cached — the same override the Dockerfile makes, for the same reason.
      - name: Prepare npm cache
        run: mkdir -p "$RUNNER_TEMP/npm-cache"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --cache "$RUNNER_TEMP/npm-cache"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The MCP server is a Node bundle, not part of the web image, so it has no
      # place in the browser smoke job — but the bundled server is what clients
      # launch, so it is exercised here where the source it wraps has just passed.
      - name: MCP server smoke test
        run: npm run test:mcp

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare npm cache
        run: mkdir -p "$RUNNER_TEMP/npm-cache"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --cache "$RUNNER_TEMP/npm-cache"

      # The unit suite runs in jsdom, so it cannot prove that the *built* bundle
      # boots in a real browser. This job closes that gap before an image ships.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built bundle
        run: npm run test:e2e

  # The composition is the deployment artefact, so it is exercised before any
  # image is published: the real Dockerfiles build, the real compose topology
  # starts, migrations run, and the API and MCP are proved to read and write the
  # same project volume. This is the Phase 6 property a browser smoke test cannot
  # reach, and it runs in the repository's own CI rather than only locally.
  container-integration:
    name: Container integration
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare npm cache
        run: mkdir -p "$RUNNER_TEMP/npm-cache"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --cache "$RUNNER_TEMP/npm-cache"

      # Builds the three real images with the real Dockerfiles and proves the
      # API and the MCP service share one project: MCP writes, API reads, and
      # the reverse. It tears the composition down itself.
      - name: Run the container integration test
        run: npm run test:containers

  # Regression guard for the multi-arch build. The non-native leg of a
  # multi-arch build is emulated, and a build stage that runs `npm ci` there
  # executes dependency install scripts under QEMU, which dies with "qemu:
  # uncaught target signal 4 (Illegal instruction)" on some runners — a failure
  # that only appears in CI, never in a single-arch local build. The Dockerfiles
  # therefore pin their build stages to `$BUILDPLATFORM`, and this job proves it:
  # it performs the same two-platform build `publish` does, without pushing, so a
  # regression fails here instead of at the point where images are meant to ship.
  #
  # It populates the same GitHub Actions cache scopes `publish` reads, so the
  # publish build afterwards is largely a cache hit rather than a second full
  # build.
  image-builds:
    name: Multi-arch build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke, container-integration]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: Dockerfile
          - service: api
            dockerfile: Dockerfile.api
          - service: mcp
            dockerfile: Dockerfile.mcp
          - service: proxy
            context: ./deploy/reverse-proxy
            dockerfile: deploy/reverse-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # `type=cacheonly` builds and caches every layer without exporting an
      # image, which is all this job has to prove: both platforms compile and
      # link into a runnable image.
      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    name: Build and push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [verify, browser-smoke, container-integration, image-builds]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The web image keeps the bare repository name it has always had, so
          # an existing stack keeps pulling the same reference. The two server
          # images are namespaced under it.
          - service: web
            dockerfile: Dockerfile
            image: ${{ github.repository }}
            tag_suffix: ""
          - service: api
            dockerfile: Dockerfile.api
            image: ${{ github.repository }}/api
            tag_suffix: "-api"
          - service: mcp
            dockerfile: Dockerfile.mcp
            image: ${{ github.repository }}/mcp
            tag_suffix: "-mcp"
          - service: proxy
            context: ./deploy/reverse-proxy
            dockerfile: deploy/reverse-proxy/Dockerfile
            image: ${{ github.repository }}/proxy
            tag_suffix: "-proxy"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image but never push it, so a PR cannot publish
      # a tag; the login is skipped for them too.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 + arm64: a Portainer host is as likely to be an ARM NAS or a
      # Raspberry Pi as it is an x86 server, and the images are small enough that
      # the emulated leg is cheap.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A per-service cache scope, or the three legs would evict each
          # other's layers in the shared GitHub Actions cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # The published web image is served once to prove routing and asset
      # permissions work. The two server images are *not* probed here: both
      # migrate the schema during startup, so a container without a database is
      # meant to fail, and a "health check" against one would prove nothing. The
      # `container-integration` job above is what proves them — it starts the
      # real composition against a real PostgreSQL and exercises both hosts.
      - name: Smoke test the published web image
        if: github.event_name != 'pull_request' && matrix.service == 'web'
        run: |
          set -euo pipefail
          # Fetch into a scratch dir: the repository root has its own
          # index.html, and a stray write there would clobber a source file.
          work="$(mktemp -d)"
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "Smoke-testing $image"
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 8080:8080 "$image"

          ready=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ -o "$work/index.html"; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::the image never served / within 30s"
            docker logs smoke
            exit 1
          fi
          grep -q 'id="root"' "$work/index.html"

          # The nginx SPA fallback must return the shell for a client-side route.
          curl -fsS http://127.0.0.1:8080/some/client/route -o "$work/route.html"
          grep -q 'id="root"' "$work/route.html"

          # A hashed bundle asset must be fetchable, which catches asset-path and
          # file-permission regressions that a plain "/ returns 200" misses.
          asset="$(grep -o '/assets/[^"]*\.js' "$work/index.html" | head -n 1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:8080$asset" -o /dev/null
          echo "Image serves the app, the SPA fallback and $asset"

      # The server images are multi-arch builds, so `docker image inspect` on the
      # runner sees a manifest list rather than a runnable image. Record the
      # digest the manifest was pushed under: that digest is what a Portainer
      # stack pins to, and what makes a running deployment traceable to a commit.
      - name: Report the published digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          reference="${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.meta.outputs.digest }}"
          echo "${{ matrix.service }} image: $reference" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$reference" || true
