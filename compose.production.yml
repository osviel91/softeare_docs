# ---------------------------------------------------------------------------
# Production-shaped composition: reverse proxy, web, API, MCP, PostgreSQL.
#
#   docker compose -f compose.production.yml up --build -d
#
# This is one file with two supported entry points, because the same topology has
# to run both ways:
#
#   * **Build from a checkout** — the command above, which is what the
#     `container-integration` CI job and local verification use. Each service
#     builds its own Dockerfile from this repository.
#   * **Deploy published images** — a Portainer stack (Git repository or web
#     editor) with `WEB_IMAGE`, `API_IMAGE` and `MCP_IMAGE` set to the images
#     `publish-image.yml` pushes to GHCR. Nothing is built on the host, so the
#     running deployment traces back to a pushed commit. Pin the immutable
#     `sha-<short>` tag (or a digest) rather than `latest` when a deployment has
#     to be reproducible.
#
# This is the topology Phase 6 defines:
#
#   internet → HTTPS → reverse-proxy ─┬─ web   (nginx + static bundle)
#                                     ├─ api   (Node, /api /auth)
#                                     └─ mcp   (Node, /mcp)
#
# Three deliberate properties:
#
#   * **No source bind mounts.** Every service runs the artifact built into its
#     image, and state lives only in named volumes.
#   * **The MCP is its own host and its own hostname.** It is not a route on the
#     API, so it can be rate-limited, firewalled and scaled independently.
#   * **Secrets come from the environment**, never from the image. Both Node
#     services refuse to start when a required secret is missing (see
#     `apps/api/config.ts` and `apps/mcp/config.ts`).
#
# TLS terminates at the proxy. For local use the proxy also publishes plain HTTP
# on 8080 so the composition can be exercised without certificates; in a real
# deployment terminate TLS with the certificates the proxy config expects.
#
# Required environment (see `.env.example`): POSTGRES_PASSWORD, COOKIE_SECRET,
# TOKEN_PEPPER, API_PUBLIC_URL, MCP_PUBLIC_URL, OIDC_ISSUER, OIDC_CLIENT_ID,
# OIDC_CLIENT_SECRET. PLATFORM_ADMIN_EMAIL is optional; TOKEN_PEPPER must be
# independent of COOKIE_SECRET.
# ---------------------------------------------------------------------------
services:
  reverse-proxy:
    build:
      context: ./deploy/reverse-proxy
    image: "${PROXY_IMAGE:-software-docs-proxy:phase6}"
    restart: unless-stopped
    depends_on:
      - web
      - api
      - mcp
    ports:
      - "${PROXY_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${WEB_IMAGE:-software-docs-web:phase6}"
    restart: unless-stopped
    # No ports: only the proxy reaches it, over the compose network.
    expose:
      - "8080"
    # The web image is nginx plus static files: no Node, no MCP runtime, no
    # database driver.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: "${API_IMAGE:-software-docs-api:phase6}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      PUBLIC_URL: "${API_PUBLIC_URL:?set API_PUBLIC_URL, for example https://api.docs.example.com}"
      DATABASE_URL: "postgres://sdm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sdm"
      PROJECT_VOLUME: /data/projects
      COOKIE_SECRET: "${COOKIE_SECRET:?set COOKIE_SECRET}"
      # Required, and independent of COOKIE_SECRET (Phase 6 §73).
      TOKEN_PEPPER: "${TOKEN_PEPPER:?set TOKEN_PEPPER}"
      OIDC_ISSUER: "${OIDC_ISSUER:?set OIDC_ISSUER}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}"
      PLATFORM_ADMIN_EMAIL: "${PLATFORM_ADMIN_EMAIL:-}"
      TRUSTED_PROXIES: "172.16.0.0/12"
    expose:
      - "4000"
    volumes:
      - project-data:/data/projects
    read_only: true
    tmpfs:
      - /tmp

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: "${MCP_IMAGE:-software-docs-mcp:phase6}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4100"
      HOST: 0.0.0.0
      # The canonical protected-resource identity. Never derived from Host.
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL, for example https://mcp.docs.example.com}"
      DATABASE_URL: "postgres://sdm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sdm"
      PROJECT_VOLUME: /data/projects
      TOKEN_PEPPER: "${TOKEN_PEPPER:?set TOKEN_PEPPER}"
      TRUSTED_PROXIES: "172.16.0.0/12"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_MAX_BODY_BYTES: "${MCP_MAX_BODY_BYTES:-1048576}"
      MCP_TOOL_TIMEOUT_MS: "${MCP_TOOL_TIMEOUT_MS:-30000}"
      MCP_RATE_READ_LIMIT: "${MCP_RATE_READ_LIMIT:-600}"
      MCP_RATE_WRITE_LIMIT: "${MCP_RATE_WRITE_LIMIT:-60}"
      MCP_RATE_DELETE_LIMIT: "${MCP_RATE_DELETE_LIMIT:-10}"
      MCP_METRICS: "${MCP_METRICS:-true}"
    expose:
      - "4100"
    volumes:
      # The same project volume the API uses: both hosts read and write the same
      # documents, and neither calls the other over HTTP to do it.
      - project-data:/data/projects
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: sdm
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdm -d sdm"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  project-data:
