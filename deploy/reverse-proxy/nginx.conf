# ---------------------------------------------------------------------------
# The production reverse proxy (Phase 6 §47–51).
#
# Three hostnames, one purpose each:
#
#   docs.example.com        → web   (the static SPA)
#   api.docs.example.com    → api   (session + bearer API)
#   mcp.docs.example.com    → mcp   (PAT-only MCP endpoint)
#
# A separate hostname for MCP is not cosmetic: it gives the endpoint its own
# rate limit, its own security headers, its own firewall rule and — in Phase 7 —
# its own OAuth resource identity. It also means a browser's ambient cookie for
# the web origin is never sent to the MCP origin at all, which is the strongest
# version of "a session cookie cannot authenticate MCP".
#
# This file is the *local* configuration used by `compose.production.yml`: it
# serves plain HTTP on 8080 so the composition can be tested without
# certificates. The commented `server` blocks below show the TLS form a real
# deployment uses; terminate TLS here and leave the container traffic on the
# private network.
#
# Trusted proxy headers: this proxy sets `X-Forwarded-For` and
# `X-Forwarded-Proto` itself, and both Node services are configured with
# `TRUSTED_PROXIES` covering the compose network, so they are believed only from
# here. A client cannot inject them through the proxy.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- web ------------------------------------------------------------------
server {
    listen 8080;
    server_name docs.localhost localhost _;

    # The SPA and the API used to share an origin; keeping the proxy able to
    # route /api and /auth here preserves that for a single-hostname deployment.
    location /api/ {
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /auth/ {
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /healthz {
        proxy_pass http://api:4000;
    }

    # A single-hostname convenience route. Prefer the dedicated `mcp.localhost`
    # server below in production — a separate origin is what keeps the MCP's
    # cookies, CORS policy and rate limit independent — but a deployment with
    # one certificate and one hostname can still reach the endpoint here, with
    # the same cookie stripping and the same body cap.
    location = /mcp {
        proxy_pass http://mcp:4100/mcp;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://web:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

# ---- MCP ------------------------------------------------------------------
server {
    listen 8080;
    server_name mcp.localhost;

    # `/mcp` is deliberately the *only* thing this origin serves apart from the
    # probes. There is no static file handler, no directory listing and no SPA
    # fallback, so an unknown path is a 404 rather than an HTML page.
    location = /mcp {
        proxy_pass http://mcp:4100/mcp;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # Never forward a browser cookie to the MCP upstream. The service
        # ignores cookies anyway; stripping them here means a session cookie
        # cannot even reach the origin that must never accept it.
        proxy_set_header Cookie "";

        # MCP responses are never cacheable: they depend on the caller's
        # credential.
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 2m;

        # No CORS. An agent is not a browser, and a wildcard on an
        # authenticated endpoint is a vulnerability, not a convenience.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /mcp/ {
        proxy_pass http://mcp:4100/mcp;
        include /etc/nginx/conf.d/proxy-headers.inc;
        client_max_body_size 2m;
    }

    location = /health {
        proxy_pass http://mcp:4100/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://mcp:4100/ready;
        access_log off;
    }

    # Metrics stay on the private network by default. A deployment that wants
    # Prometheus to scrape them should route this to an internal listener rather
    # than exposing it publicly.
    location = /metrics {
        deny all;
        return 403;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# TLS: the production form of the MCP server block.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name mcp.docs.example.com;
#
#     ssl_certificate     /etc/nginx/certs/mcp.crt;
#     ssl_certificate_key /etc/nginx/certs/mcp.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     location = /mcp { proxy_pass http://mcp:4100/mcp; ... }
# }
#
# server {
#     listen 80;
#     server_name mcp.docs.example.com;
#     return 308 https://$host$request_uri;
# }
#
# The HSTS header is added only after TLS is verified working; the comment in
# the mission is explicit that it is a post-verification step, because an HSTS
# header served from a broken TLS listener locks users out for its max-age.
# ---------------------------------------------------------------------------
