server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets (hashed) can be cached aggressively; everything else is
    # served from disk.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any route that isn't a real file serves index.html so the
    # client router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # favicon is referenced at /favicon.svg in index.html.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }
}
